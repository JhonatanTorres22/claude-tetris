<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="clear-effect" class="clear-effect"></div>
      </div>

      <aside class="panel">
        <div class="panel-section theme-section">
          <span class="label">MODO CLARO</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" aria-label="Alternar modo claro/oscuro" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <button id="challenge-btn" class="challenge-btn">🏆 Desafíos</button>
        </div>

        <div class="panel-section" id="objective-section" hidden>
          <span class="label">OBJETIVO</span>
          <span class="objective-desc" id="objective-desc"></span>
          <div class="objective-bar"><div class="objective-bar-fill" id="objective-bar-fill"></div></div>
          <span class="objective-value" id="objective-value"></span>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section" id="combo-section" hidden>
          <span class="label">COMBO</span>
          <span class="value combo-value" id="combo-value">x2</span>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UP EN</span>
          <span class="value" id="powerup-countdown">10</span>
        </div>

        <div class="panel-section" id="skills-section">
          <span class="label">HABILIDADES</span>
          <div class="skill-bar"><div class="skill-bar-fill" id="skill-bar-fill"></div></div>
          <div class="skills-row" id="skill-icons"></div>
        </div>

        <div class="panel-section" id="next-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
          <span class="next-power-label" id="next-label"></span>
        </div>

        <div class="panel-section" id="hold-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="80" height="80"></canvas>
        </div>

        <div class="panel-section" id="preview-section" hidden>
          <span class="label">VISIÓN <span id="preview-countdown"></span></span>
          <canvas id="preview-canvas" width="250" height="50"></canvas>
        </div>

        <div class="panel-section" id="status-section" hidden>
          <span class="label">ESTADO</span>
          <span class="status-value" id="powerup-status"></span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>1</kbd>–<kbd>5</kbd> habilidad</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
        <button id="challenge-back-btn" class="secondary-btn" hidden>Volver a desafíos</button>
      </div>
    </div>

    <div id="challenge-overlay" class="overlay hidden">
      <div class="overlay-box challenge-box">
        <p class="challenge-title">MODO DESAFÍO</p>
        <div class="challenge-list" id="challenge-list"></div>
        <button id="challenge-close-btn" class="secondary-btn">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
